<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <h2>Admin Panel</h2>
            <ul>
                <li><a href="admin.html">Dashboard</a></li>
                <li><a href="manage-products.html" class="active">Manage Products</a></li>
                <li><a href="manage-orders.html">Manage Orders</a></li>
                <li><a href="../index.html">Back to Store</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header>
                <h1>Product Management</h1>
            </header>

            <section class="form-section">
                <h3 id="form-title">Add New Product</h3>
                <form id="product-form">
                    <input type="hidden" id="product-id">
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="product-name" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="product-category" required>
                            <option value="food">Food</option>
                            <option value="clothing">Clothing</option>
                            <option value="electronics">Electronics</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price ($)</label>
                        <input type="number" id="product-price" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Stock Quantity</label>
                        <input type="number" id="product-stock" required>
                    </div>
                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="text" id="product-image" placeholder="images/sample.jpeg" required>
                    </div>
                    <button type="submit" class="btn-primary" id="save-btn">Add Product</button>
                    <button type="button" class="btn-secondary" id="cancel-btn" style="display:none;">Cancel</button>
                </form>
            </section>

            <section class="table-section">
                <h2>Product List</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body">
                        <!-- Dynamic rows -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="js/inventory.js"></script>
</body>
</html>
